<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Metallic Stroke -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="2.5" />

  <!-- Subtle Inner Tech Mesh Lines -->
  <path d="M12 20 L52 20 M12 44 L52 44" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" stroke-dasharray="2 3" />

  <!-- Monogram "SIR" for Shariful Islam Rayhan -->
  <text x="32" y="39" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="21" 
        font-weight="900" 
        letter-spacing="-0.5"
        fill="url(#textGrad)" 
        text-anchor="middle"
        filter="drop-shadow(0 1px 2px rgba(0,0,0,0.8))">
    SIR
  </text>

  <!-- Active Status / IT Pulse Dot -->
  <circle cx="50" cy="14" r="3.5" fill="#10b981" filter="url(#glow)" />
  <circle cx="50" cy="14" r="2" fill="#ffffff" />
</svg>
